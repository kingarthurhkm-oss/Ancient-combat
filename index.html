*{box-sizing:border-box}body{margin:0;background:#171119;color:var(--ink);font:14px/1.35 system-ui,sans-serif;overflow:hidden}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#game{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;background:#301c32}
canvas,.cover{position:absolute;inset:0;width:100%;height:100%}canvas{display:block}.cover{display:grid;place-items:center;background:linear-gradient(#1b10244a,#160d17c9),var(--cover-art) center/cover no-repeat;z-index:3}.cover[hidden]{display:none}
.intro{text-align:center;text-shadow:0 2px 8px #140b13;padding:16px}h1{font:clamp(34px,8vw,90px)/.95 Georgia,serif;letter-spacing:.055em;margin:0 0 14px}.intro p{margin:0 0 24px;color:#ffe0c3}
button{border:1px solid #ae8367;background:#24191deb;border-radius:5px;padding:7px 12px;min-height:42px}button:hover:not(:disabled),button[aria-pressed=true]{background:#56382c;border-color:var(--gold)}button:disabled{opacity:.44;cursor:default}.primary{background:#f4c38f;color:#291a17;font-weight:800;padding-inline:24px}.primary:hover:not(:disabled){background:#ffe0a8}
.hud,.controls{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));z-index:1}.hud{top:max(9px,env(safe-area-inset-top));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px}
.side,.spacing,.commands,.status{background:#1a141de8;border:1px solid #d7ac895e;border-radius:5px}.side{padding:6px 10px;width:min(100%,255px);min-width:0}.side.enemy{justify-self:end}.side strong{color:var(--blue)}.enemy strong{color:var(--red)}.row{display:flex;align-items:center;justify-content:space-between;gap:6px}.row span{font-variant-numeric:tabular-nums}
progress{display:block;width:100%;height:5px;accent-color:var(--blue);margin:3px 0}.enemy progress{accent-color:var(--red)}.fatigue{display:flex;gap:10px;color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap}
.spacing{text-align:center;min-width:100px;padding:4px 8px}.spacing strong{display:block;color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}.spacing small{color:var(--muted)}
.controls{bottom:max(8px,env(safe-area-inset-bottom));display:grid;justify-items:center;gap:5px}.status{padding:3px 10px;color:var(--gold);min-height:26px;text-align:center}.status progress{accent-color:var(--gold);margin-bottom:2px}.status progress[hidden]{display:none}
.commands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:5px;width:min(100%,550px)}.commands button{white-space:nowrap;padding-inline:4px}.commands span{margin-right:4px;color:var(--gold)}.commands #restart{color:var(--muted)}
#portrait{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:linear-gradient(#1b10244a,#160d17df),var(--cover-art) center/auto 100% no-repeat;text-align:center;padding:26px}
#portrait h2{font-size:25px;margin:0 0 6px}#portrait p{color:var(--muted);margin:0 0 16px}#fullscreen[hidden]{display:none}
@media(orientation:portrait){#portrait{display:grid}}
@media(max-height:390px) and (orientation:landscape){.hud{top:max(5px,env(safe-area-inset-top))}.side{padding:4px 7px}.controls{bottom:max(4px,env(safe-area-inset-bottom));gap:3px}.status{font-size:12px;min-height:21px;padding-block:2px}.commands{padding:3px}.commands button{min-height:38px}.intro p{margin-bottom:14px}}
.cover{background:linear-gradient(90deg,#150f2055,#140d1488),var(--cover-art) center/cover no-repeat}
.campLayout{display:grid;grid-template-columns:1fr minmax(265px,380px);gap:5vw;align-items:center;width:min(94%,1050px);max-height:100%;overflow:auto;padding:8px}
.campTitle h1{font:normal clamp(38px,6.8vw,94px)/.93 'Cinzel',Georgia,serif;letter-spacing:.06em;text-shadow:0 3px 20px #211225}
.campTitle p{color:#ffe0b4;font-size:clamp(14px,1.8vw,22px);max-width:30ch}
.equipment{padding:clamp(10px,2.5vh,24px) clamp(13px,2vw,25px);background:linear-gradient(140deg,#261822f2,#190f16f7);border:1px solid #c895697a;border-radius:3px;box-shadow:0 12px 42px #10081050}
.equipment h2{font-size:19px;margin:0}.equipment p{font-size:12px;color:#ead4c1;line-height:1.5;margin:4px 0}.equipment #nextGear{color:#d9b58b}
.lineRow,.officers,.gearLabel,.attackLabel{display:flex;align-items:center;gap:8px}.lineRow{justify-content:space-between;margin-bottom:5px}.lineRow span,.officers{font-size:13px}.equipment button{min-height:36px}.equipment .primary{display:block;width:100%;margin-top:8px}.officers{flex-wrap:wrap;border-top:1px solid #7e5d4c;padding-top:7px;margin-top:8px}.officers input{accent-color:#d19c66}.officers span{margin-left:auto;color:var(--gold)}
select{font:inherit;border:1px solid #9c795d;border-radius:3px;background:#291d22;color:#fff0db;padding:5px}.gearLabel select{flex:1;min-width:0}.commands{width:min(100%,680px);grid-template-columns:repeat(4,1fr) 1.5fr 1fr}.attackLabel{justify-content:center;gap:4px;font-size:13px}.attackLabel select{max-width:90px;min-height:36px}
.side,.spacing,.commands,.status{background:linear-gradient(130deg,#241824ef,#150e17de);border-color:#d9af7960}.side strong{letter-spacing:.08em}.status{font-size:12px}

<body>
<main id="game">
<canvas id="field" aria-label="양쪽 보병이 움직이는 횡스크롤 전장"></canvas>
<div class="hud">
  <section class="side" aria-label="아군 상태">
    <div class="row"><strong>아군</strong><span id="playerCohesion"></span></div>
    <progress id="playerMeter" max="100" aria-label="아군 진형"></progress>
    <div class="fatigue"><span id="frontLabel"></span><span id="rearLabel"></span></div>
  </section>
  <div class="spacing"><strong id="gap"></strong><small id="clock"></small></div>
  <section class="side enemy" aria-label="상대 상태">
    <div class="row"><strong>상대</strong><span id="enemyCohesion"></span></div>
    <progress id="enemyMeter" max="100" aria-label="상대 진형"></progress>
    <div class="fatigue" id="enemyStatus"></div>
  </section>
</div>
<div class="controls">
  <div class="status"><span id="status" role="status"></span><progress id="rotation" hidden aria-label="교대 진행"></progress></div>
  <div class="commands" aria-label="전열 지휘">
    <button data-order="retreat">← 후퇴</button><button data-order="hold">정지</button><button data-order="advance">전진 →</button><button data-order="rotate">⇄ 교대</button>
    <label class="attackLabel">공격 <select id="attack" aria-label="공격 유형"></select></label><button id="camp">진영 복귀</button>
  </div>
</div>
<div class="cover" id="cover">
  <div class="campLayout">
    <div class="campTitle"><h1>ANCIENT<br>COMBAT</h1><p id="report">승리 시 훈련점 3점 · 그 외 완주 시 1점</p></div>
    <section class="equipment" aria-label="부대 편성">
      <div class="lineRow"><h2>출전 준비</h2><span id="points"></span></div>
      <div class="lineRow"><span id="level"></span><button id="train">체력 훈련</button></div>
      <label class="gearLabel">무장 <select id="gear"></select></label>
      <p id="gearStats"></p><p id="nextGear"></p>
      <div class="officers"><label><input type="checkbox" id="captain" checked> 대장</label><label><input type="checkbox" id="banner" checked> 군기</label><span id="leadership"></span></div>
      <button class="primary" id="start">전장 진입 →</button>
    </section>
  </div>
</div>
<section id="portrait" aria-label="가로 모드 안내">
  <div>
    <h2>기기를 가로로 돌려주세요</h2>
    <p>가로 화면에서 전장과 명령을 함께 볼 수 있습니다.</p>
    <button id="fullscreen" hidden>가로 전체 화면</button>
  </div>
</section>
</main>
<script>
const CONTACT_GAP = 5;
const CONTACT_DISTANCE = 204;
const ORDERS = {advance:'전진 중',hold:'정지 중',retreat:'후퇴 중',rotate:'전열 교대 중'};
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const smooth = t => t * t * (3 - 2 * t);
// Weight is an abstract equipment load. These are game balance values.
const KITS = [
  {name:'경보병 단검', weapon:'knife', weight:1, damage:5, guard:1, level:1},
  {name:'청동창과 원형 방패', weapon:'spear', weight:2, damage:7, guard:2.5, level:1},
  {name:'중보병 장검과 대형 방패', weapon:'sword', weight:3.5, damage:10, guard:4.5, level:2},
  {name:'근위대 도끼와 철갑 방패', weapon:'axe', weight:5, damage:14, guard:6.5, level:3}
];
const ATTACKS = {
  thrust:{name:'찌르기',period:.85,power:.86,cost:3},
  cut:{name:'베기',period:1.15,power:1.22,cost:5},
  slam:{name:'내려찍기',period:1.68,power:1.9,cost:9}
};
const maxEnergy = level => 80 + (level-1) * 30;
const speedFor = kit => 84 - kit.weight * 6;
const swapTime = kit => 1.25 + kit.weight * .35;
const marchCost = kit => .045 + .022 * kit.weight;
const trainingCost = level => level + 1;
const profileKey = 'ancient-combat.training.v1';
function loadProfile() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(profileKey)); } catch {}
  const valid = (n, lo, hi, fallback) => Number.isInteger(n) && n >= lo && n <= hi ? n : fallback;
  const level = valid(saved?.level,1,5,1);
  const kit = valid(saved?.kit,0,KITS.length-1,1);
  return {level, points:valid(saved?.points,0,9999,0), kit:KITS[kit].level <= level ? kit : 1,
    captain:saved?.captain !== false, banner:saved?.banner !== false};
}
const profile = loadProfile();
function saveProfile() {
  try { localStorage.setItem(profileKey,JSON.stringify(profile)); } catch {}
}
function makeSide(x, kit, capacity, captain, banner) {
  return {x, kit, capacity, captain, banner, leadership:40 + 24*captain + 16*banner,
    cohesion:100, front:0, energy:[capacity,capacity], velocity:0,
    attack:'thrust', nextAttack:'thrust', cycle:0, impact:0};
}
function freshBattle() {
  return {active:false, elapsed:0, result:'', order:'hold', rotationLeft:0,
    player:makeSide(0,KITS[profile.kit],maxEnergy(profile.level),profile.captain,profile.banner),
    enemy:makeSide(450,KITS[1],85,false,true)};
}
function issue(battle, order) {
  if (!battle.active || battle.rotationLeft > 0) return;
  battle.order = order;
  if (order === 'rotate') {
    battle.rotationLeft = swapTime(battle.player.kit);
    battle.player.velocity = 0;
  }
}
function readiness(side) {
  return .3 + .7 * side.energy[side.front] / side.capacity;
}
function maneuver(side, distance, rotating, contact, dt) {
  const cost = distance * marchCost(side.kit) + (rotating ? 2 + side.kit.weight : 0) * dt;
  for (let i=0; i<2; i++) {
    const resting = !rotating && distance < .001;
    const recovery = resting && i !== side.front ? 4.2 : resting && !contact ? 1.5 : 0;
    side.energy[i] = clamp(side.energy[i] - cost + recovery * dt, 0, side.capacity);
  }
  // Orders and movement temporarily strain the formation. Leadership damps that loss.
  const disorder = distance * .007 + (rotating ? 1.7*dt : 0);
  const rally = !contact && distance < .001 && !rotating ? side.leadership * .012 * dt : 0;
  side.cohesion = clamp(side.cohesion - disorder * (1 - side.leadership/125) + rally, 0, 100);
}
function strike(side, defender, contact, rotating, dt) {
  side.impact = Math.max(0,side.impact-dt);
  if (!contact || rotating) {
    side.cycle = 0;
    side.attack = side.nextAttack;
    return 0;
  }
  const attack = ATTACKS[side.attack];
  side.cycle += dt / attack.period;
  if (side.cycle < 1) return 0;
  const strength = side.kit.damage * attack.power * readiness(side);
  const guard = defender.kit.guard * (.55 + .45 * readiness(defender));
  const damage = Math.max(.7, strength - guard) * (1 - defender.leadership/330);
  const i = side.front;
  side.energy[i] = Math.max(0,side.energy[i]-attack.cost*(.72+.23*side.kit.weight));
  side.cycle -= 1;
  side.impact = .22;
  side.attack = side.nextAttack;
  return damage;
}
function step(battle, dt) {
  if (!battle.active) return;
  const {player,enemy} = battle;
  const rotating = battle.rotationLeft > 0;
  const oldX = player.x, oldEnemyX = enemy.x;
  const pace = speedFor(player.kit) * (.65 + .35 * readiness(player));
  const speed = battle.order === 'advance' ? pace : battle.order === 'retreat' ? -pace*.85 : 0;
  battle.elapsed += dt;
  if (!rotating) player.x = clamp(player.x + speed*dt,-540,enemy.x-CONTACT_DISTANCE);
  enemy.x = Math.max(player.x+CONTACT_DISTANCE,enemy.x-46*dt);
  player.velocity = (player.x-oldX)/dt;
  enemy.velocity = (enemy.x-oldEnemyX)/dt;
  const contact = enemy.x-player.x-CONTACT_DISTANCE <= CONTACT_GAP;
  maneuver(player,Math.abs(player.x-oldX),rotating,contact,dt);
  maneuver(enemy,Math.abs(enemy.x-oldEnemyX),false,contact,dt);
  const taken = strike(enemy,player,contact,false,dt);
  const dealt = strike(player,enemy,contact,rotating,dt);
  player.cohesion = Math.max(0,player.cohesion-taken);
  enemy.cohesion = Math.max(0,enemy.cohesion-dealt);
  if (rotating) {
    battle.rotationLeft = Math.max(0,battle.rotationLeft-dt-1e-9);
    if (!battle.rotationLeft) {
      player.front = 1-player.front;
      battle.order = 'hold';
    }
  }
  if (player.cohesion === 0 || enemy.cohesion === 0) {
    battle.result = player.cohesion === enemy.cohesion ? '무승부' : player.cohesion > enemy.cohesion ? '승리' : '패배';
    battle.active = false;
  }
}
const byId = id => document.getElementById(id);
const commands = Array.from(document.querySelectorAll('[data-order]'));
const field = byId('field');
const ctx = field.getContext('2d');
const portrait = matchMedia('(orientation: portrait)');
let battle = freshBattle();
let lastTime;
let viewWidth = 0;
let viewHeight = 0;
let pixelRatio = 1;

function resize() {
  viewWidth = field.clientWidth;
  viewHeight = field.clientHeight;
  pixelRatio = Math.min(devicePixelRatio || 1, 2);
  field.width = Math.round(viewWidth * pixelRatio);
  field.height = Math.round(viewHeight * pixelRatio);
  draw();
}
function line(points, color, width) {
  ctx.beginPath();
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.stroke();
}
function ellipse(x, y, w, h, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

  const angle=s.engaged ? attackAngles[attack]+swings[attack]*pulse-.48*windup : idle;
  ctx.save();
  ctx.translate(6+(attack==='thrust' ? pulse*12 : pulse*4),-49-(attack==='slam' ? windup*12 : 0));
  ctx.rotate(angle);
  if (weapon==='spear') {
    line([[0,24],[0,-66]],ink,1.8);shape(art.spear,rim);
  } else if (weapon==='axe') {
    line([[0,8],[0,-43]],ink,2.5);shape(art.axe,rim);
  } else {
    ctx.scale(1,weapon==='knife' ? .62 : 1);
    shape(art.blade,ink,rim,.65);line([[-4,-2],[4,-2]],rim,1.2);
  }
  ctx.restore();
  line([[-4,-53],[1,-45],[7+pulse*7,-49]],ink,4.2);
}
function standard(s, rim, ink) {
  const wave=Math.sin(s.time*4+s.phase*.12);
  line([[-7,-10],[-9,-113]],ink,2.6);
  ellipse(-9,-115,3.3,3.3,rim);
  const cloth=new Path2D();
  cloth.moveTo(-9,-109);cloth.bezierCurveTo(-22,-114+wave*2,-27,-99,-42,-106+wave*4);
  cloth.lineTo(-40,-80+wave*3);cloth.bezierCurveTo(-29,-77,-21,-89+wave*3,-9,-85);cloth.closePath();
  shape(cloth,s.friendly?'#493238':'#51242e',rim,.65);
  line([[-25,-101+wave],[-21,-97+wave],[-25,-90+wave],[-29,-95+wave],[-25,-101+wave]],'#c19a71',1.2);
}
function drawSoldier(s, screenX, ground, zoom) {
  const near=clamp(s.depth/8,0,1);
  const ink = near>.6 ? '#18131a' : near>.28 ? '#35222b' : '#52333a';
  const rim = near>.56 ? '#84645b' : '#a57665';
  const size=zoom*(.79+near*.22+.025*Math.sin(s.index*2+s.rank));
  const swing=s.stride ? Math.sin(s.phase)*9 : 0;
  const bob=s.stride ? Math.abs(Math.sin(s.phase))*1.9 : Math.sin(s.phase)*.5;
  ctx.save();ctx.translate(screenX,ground);ctx.scale(s.direction*size,size);
  ellipse(-1,1,13,2.2,'#160f15aa');
  limb(-3,-5-swing*.47,-8-swing,near>.5?'#211820':ink);
  limb(2,3+swing*.44,6+swing,ink);
  ctx.translate(0,-bob);
  shape(art.cloak,ink);shape(art.torso,ink);
  line([[-10,-53],[-12,-44],[-16,-32]],near>.45?'#36252a':'#64434a',.85);
  line([[-8,-37],[4,-35]],rim,1.15);
  line([[-5,-34],[-6,-29]],rim,.75);
  shape(art.face,ink);shape(art.helmet,ink,rim,.65);
  if (s.captain) shape(art.crest,'#754743',rim,.8);
  else if (s.index%3===0) shape(art.plume,ink);
  if (s.banner) standard(s,rim,ink);
  else drawWeapon(s,ink,rim);
  ctx.save();ctx.translate(2+s.slot*1.4,0);
  const shieldPath = s.side.kit.weight>2 ? art.tower : art.shield;
  shape(shieldPath,s.friendly ? '#28242b' : '#302026',rim,.9);
  line([[4,-51],[7,-45],[10,-51]],s.friendly?'#78756f':'#91685a',1);
  ellipse(8,-40,2.5,3.8,rim);
  if (s.side.kit.weapon==='axe') {
    line([[4,-45],[6,-53],[8,-49],[11,-55],[13,-47]],'#d6a76f',1.4);
  }
  if (s.engaged && s.side.impact>.12 && s.index%4===0) {
    const fade=(.22-s.side.impact)*50;
    line([[22+fade,-47],[25+fade,-49]],'#e0af78',1);
    line([[21+fade,-45],[24+fade,-44]],'#d0936c',.8);
  }
  ctx.restore();ctx.restore();
}
function enemyGap() { return Math.max(0,battle.enemy.x-battle.player.x-CONTACT_DISTANCE); }
function draw() {
  if (!viewWidth || !viewHeight) return;
  ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  const zoom=Math.min(viewHeight/340,viewWidth/880);
  const camera=battle.player.x-clamp(battle.player.x*.36,-100,100)-viewWidth*.27/zoom;
  const plateWidth=viewWidth*1.10;
  const left=-viewWidth*.05-clamp(battle.player.x*zoom*.035,-viewWidth*.04,viewWidth*.04);
  if (plate.complete && plate.naturalWidth) ctx.drawImage(plate,left,0,plateWidth,viewHeight);
  else {ctx.fillStyle='#783f47';ctx.fillRect(0,0,viewWidth,viewHeight);}
  const sprites=[...soldiers(battle.player,true,battle.elapsed),...soldiers(battle.enemy,false,battle.elapsed)];
  sprites.sort((a,b)=>a.depth-b.depth);
  for (const sprite of sprites) {
    const x=(sprite.x-camera)*zoom;
    const t=clamp((x-left)/plateWidth*(crest.length-1),0,crest.length-1);
    const i=Math.floor(t);
    const ridge=crest[i]+((crest[i+1]??crest[i])-crest[i])*(t-i);
    drawSoldier(sprite,x,viewHeight*ridge+(4+sprite.depth*2.9)*zoom,zoom);
  }
}
function updateText(id, text) {
  const element = byId(id);
  if (element.textContent !== text) element.textContent = text;
}
function prepareCamp() {
  const kit = KITS[profile.kit];
  const capacity = maxEnergy(profile.level);
  byId('gear').replaceChildren(...KITS.map((option,index)=>{
    const item=new Option(option.name + (option.level>profile.level ? ' · 체력 '+option.level+' 필요' : ''),String(index));
    item.disabled=option.level>profile.level;
    return item;
  }));
  byId('gear').value=String(profile.kit);
  byId('captain').checked=profile.captain;
  byId('banner').checked=profile.banner;
  updateText('points','훈련점 '+profile.points);
  updateText('level','체력 '+profile.level+'단계 · 최대 '+capacity);
  const cost=trainingCost(profile.level);
  byId('train').disabled=profile.level>=5 || profile.points<cost;
  updateText('train',profile.level===5?'훈련 완료':'훈련 +30 · '+cost+'점');
  updateText('gearStats','무게 '+kit.weight+'  ·  공격 '+kit.damage+'  ·  방어 '+kit.guard+'  ·  교대 '+swapTime(kit).toFixed(1)+'초');
  const next=KITS.find(item=>item.level>profile.level);
  updateText('nextGear','기동 속도 '+speedFor(kit)+'  ·  거리 100당 체력 −'+(100*marchCost(kit)).toFixed(1)
    +(next?'  |  다음 해금  '+next.name+' (체력 '+next.level+'단계)':''));
  updateText('leadership','통솔력 '+(40+24*profile.captain+16*profile.banner));
}
function render() {
  const {player,enemy}=battle;
  const gap=enemyGap();
  updateText('clock',Math.floor(battle.elapsed)+'초');
  updateText('gap',gap<=CONTACT_GAP?'교전 중':'간격 '+Math.ceil(gap/10));
  updateText('playerCohesion','진형 '+Math.ceil(player.cohesion));
  updateText('enemyCohesion','진형 '+Math.ceil(enemy.cohesion));
  byId('playerMeter').value=player.cohesion;
  byId('enemyMeter').value=enemy.cohesion;
  updateText('frontLabel','전방 체력 '+Math.ceil(player.energy[player.front]));
  updateText('rearLabel','후방 '+Math.ceil(player.energy[1-player.front]));
  updateText('enemyStatus','전방 체력 '+Math.ceil(enemy.energy[enemy.front])+' · '+enemy.kit.name);
  updateText('status',battle.result ? battle.result+' · 훈련점 +'+battle.reward : ORDERS[battle.order]+' · 통솔력 '+player.leadership);
  byId('rotation').hidden=!battle.active || !battle.rotationLeft;
  byId('rotation').max=swapTime(player.kit);
  byId('rotation').value=swapTime(player.kit)-battle.rotationLeft;
  commands.forEach(button=>{
    button.disabled=!battle.active || battle.rotationLeft>0;
    button.setAttribute('aria-pressed',String(battle.active && button.dataset.order===battle.order));
  });
  byId('attack').disabled=!battle.active || battle.rotationLeft>0;
  draw();
}
function enterCamp() {
  battle.active=false;
  byId('cover').hidden=false;
  updateText('report',battle.result ? battle.result+' · 훈련점 +'+battle.reward : '승리 시 훈련점 3점 · 그 외 완주 시 1점');
  prepareCamp();
}
function start() {
  battle=freshBattle();
  battle.active=true;
  byId('attack').value='thrust';
  lastTime=undefined;
  byId('cover').hidden=true;
  render();
}
byId('attack').replaceChildren(...Object.entries(ATTACKS).map(([id,a])=>new Option(a.name,id)));
byId('attack').addEventListener('change',event=>{
  if (battle.active && !battle.rotationLeft) battle.player.nextAttack=event.target.value;
});
byId('gear').addEventListener('change',event=>{
  const kit=Number(event.target.value);
  if (KITS[kit]?.level<=profile.level) profile.kit=kit;
  saveProfile();prepareCamp();
});
for (const id of ['captain','banner']) byId(id).addEventListener('change',event=>{
  profile[id]=event.target.checked;
  saveProfile();prepareCamp();
});
byId('train').addEventListener('click',()=>{
  const cost=trainingCost(profile.level);
  if (profile.level>=5 || profile.points<cost) return;
  profile.points-=cost;profile.level++;
  saveProfile();prepareCamp();
});
commands.forEach(button=>button.addEventListener('click',()=>{issue(battle,button.dataset.order);render();}));
byId('start').addEventListener('click',start);
byId('camp').addEventListener('click',enterCamp);
prepareCamp();
const fullscreen = byId('fullscreen');
fullscreen.hidden = !(byId('game').requestFullscreen && screen.orientation?.lock && document.fullscreenEnabled);
fullscreen.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await byId('game').requestFullscreen();
    await screen.orientation.lock('landscape');
  } catch {
    if (document.fullscreenElement === byId('game')) await document.exitFullscreen().catch(() => {});
    fullscreen.hidden = true;
  }
});

function frame(now) {
  if (battle.active && lastTime !== undefined && now > lastTime && !document.hidden && !portrait.matches) {
    step(battle, Math.min(.05, (now - lastTime) / 1000));
    if (battle.result) {
      battle.reward = battle.result === '승리' ? 3 : 1;
      profile.points = Math.min(9999, profile.points + battle.reward);
      saveProfile();
    }
    render();
  }
  lastTime = now;
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
render();
requestAnimationFrame(frame);
</script>
</body>
