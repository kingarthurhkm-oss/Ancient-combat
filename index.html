*{box-sizing:border-box}body{margin:0;background:#171119;color:var(--ink);font:14px/1.35 system-ui,sans-serif;overflow:hidden}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#game{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;background:#301c32}
canvas,.cover{position:absolute;inset:0;width:100%;height:100%}canvas{display:block}.cover{display:grid;place-items:center;background:linear-gradient(#1b10244a,#160d17c9),var(--cover-art) center/cover no-repeat;z-index:3}.cover[hidden]{display:none}
.intro{text-align:center;text-shadow:0 2px 8px #140b13;padding:16px}h1{font:clamp(34px,8vw,90px)/.95 Georgia,serif;letter-spacing:.055em;margin:0 0 14px}.intro p{margin:0 0 24px;color:#ffe0c3}
button{border:1px solid #ae8367;background:#24191deb;border-radius:5px;padding:7px 12px;min-height:42px}button:hover:not(:disabled),button[aria-pressed=true]{background:#56382c;border-color:var(--gold)}button:disabled{opacity:.44;cursor:default}.primary{background:#f4c38f;color:#291a17;font-weight:800;padding-inline:24px}.primary:hover:not(:disabled){background:#ffe0a8}
.hud,.controls{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));z-index:1}.hud{top:max(9px,env(safe-area-inset-top));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:8px}
.side,.spacing,.commands,.status{background:#1a141de8;border:1px solid #d7ac895e;border-radius:5px}.side{padding:6px 10px;width:min(100%,255px);min-width:0}.side.enemy{justify-self:end}.side strong{color:var(--blue)}.enemy strong{color:var(--red)}.row{display:flex;align-items:center;justify-content:space-between;gap:6px}.row span{font-variant-numeric:tabular-nums}
progress{display:block;width:100%;height:5px;accent-color:var(--blue);margin:3px 0}.enemy progress{accent-color:var(--red)}.fatigue{display:flex;gap:10px;color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap}
.spacing{text-align:center;min-width:100px;padding:4px 8px}.spacing strong{display:block;color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}.spacing small{color:var(--muted)}
.controls{bottom:max(8px,env(safe-area-inset-bottom));display:grid;justify-items:center;gap:5px}.status{padding:3px 10px;color:var(--gold);min-height:26px;text-align:center}.status progress{accent-color:var(--gold);margin-bottom:2px}.status progress[hidden]{display:none}
.commands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:5px;width:min(100%,550px)}.commands button{white-space:nowrap;padding-inline:4px}.commands span{margin-right:4px;color:var(--gold)}.commands #restart{color:var(--muted)}
#portrait{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:linear-gradient(#1b10244a,#160d17df),var(--cover-art) center/auto 100% no-repeat;text-align:center;padding:26px}
#portrait h2{font-size:25px;margin:0 0 6px}#portrait p{color:var(--muted);margin:0 0 16px}#fullscreen[hidden]{display:none}
@media(orientation:portrait){#portrait{display:grid}}
@media(max-height:390px) and (orientation:landscape){.hud{top:max(5px,env(safe-area-inset-top))}.side{padding:4px 7px}.controls{bottom:max(4px,env(safe-area-inset-bottom));gap:3px}.status{font-size:12px;min-height:21px;padding-block:2px}.commands{padding:3px}.commands button{min-height:38px}.intro p{margin-bottom:14px}}
</style>
</head>
<body>
<main id="game">
<canvas id="field" aria-label="양쪽 보병이 움직이는 횡스크롤 전장"></canvas>
<div class="hud">
  <section class="side" aria-label="아군 전열">
    <div class="row"><strong>아군</strong><span id="playerCohesion"></span></div>
    <progress id="playerMeter" max="100" aria-label="아군 응집도"></progress>
    <div class="fatigue"><span id="frontLabel"></span><span id="rearLabel"></span></div>
  </section>
  <div class="spacing"><strong id="gap"></strong><small id="clock"></small></div>
  <section class="side enemy" aria-label="상대 전열">
    <div class="row"><strong>상대</strong><span id="enemyCohesion"></span></div>
    <progress id="enemyMeter" max="100" aria-label="상대 응집도"></progress>
    <div class="fatigue" id="enemyStatus"></div>
  </section>
</div>
<div class="controls" aria-label="부대 명령">
  <div class="status"><div id="status" role="status"></div><progress id="rotation" max="2" hidden aria-label="전열 교대 진행"></progress></div>
  <div class="commands">
    <button data-order="retreat"><span aria-hidden="true">←</span>후퇴</button>
    <button data-order="hold">정지</button>
    <button data-order="advance">전진<span aria-hidden="true"> →</span></button>
    <button data-order="rotate"><span aria-hidden="true">⇄</span>교대</button>
    <button id="restart">다시 시작</button>
  </div>
</div>
<div class="cover" id="cover">
  <div class="intro">
    <h1>ANCIENT COMBAT</h1>
    <p>전열을 지휘하고 전방과 후방을 교대하세요.</p>
    <button class="primary" id="start">전투 시작</button>
  </div>
</div>
<section id="portrait" aria-label="가로 모드 안내">
  <div>
    <h2>기기를 가로로 돌려주세요</h2>
    <p>가로 화면에서 전장과 명령을 함께 볼 수 있습니다.</p>
    <button id="fullscreen" hidden>가로 전체 화면</button>
  </div>
</section>
</main>
<script>
const ROTATION_TIME = 2;
const CONTACT_GAP = 5;
const CONTACT_DISTANCE = 230;
const ORDERS = {advance:'전진 중',hold:'정지 중',retreat:'후퇴 중',rotate:'교대 중 · 부대 위치 유지'};
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const smooth = t => t * t * (3 - 2 * t);

function freshBattle() {
  return {
    active:false, elapsed:0, result:'', order:'hold', rotationLeft:0,
    player:{x:0, cohesion:100, front:0, fatigue:[20,5], velocity:0},
    enemy:{x:510, cohesion:100, fatigue:18, velocity:0}
  };
}

function issue(battle, order) {
  if (!battle.active || battle.rotationLeft > 0) return;
  battle.order = order;
  if (order === 'rotate') {
    battle.rotationLeft = ROTATION_TIME;
    battle.player.velocity = 0;
  }
}

function step(battle, dt) {
  const {player, enemy} = battle;
  const oldPlayerX = player.x;
  const oldEnemyX = enemy.x;
  const rotating = battle.rotationLeft > 0;
  const speed = battle.order === 'advance' ? 68 : battle.order === 'retreat' ? -56 : 0;
  battle.elapsed += dt;

  if (!rotating) player.x = clamp(player.x + speed * dt, -540, enemy.x - CONTACT_DISTANCE);
  enemy.x = Math.max(player.x + CONTACT_DISTANCE, enemy.x - 44 * dt);
  player.velocity = (player.x - oldPlayerX) / dt;
  enemy.velocity = (enemy.x - oldEnemyX) / dt;

  const gap = enemy.x - player.x - CONTACT_DISTANCE;
  const contact = gap <= CONTACT_GAP;
  const front = player.front;
  const rear = 1 - front;
  player.fatigue[front] = clamp(player.fatigue[front] + (contact ? 11 : gap < 110 ? 3 : -2) * dt, 0, 100);
  player.fatigue[rear] = clamp(player.fatigue[rear] - (contact ? 3 : 8) * dt, 0, 100);
  enemy.fatigue = clamp(enemy.fatigue + (contact ? 10 : -2) * dt, 0, 100);
  player.cohesion = clamp(player.cohesion + (contact ? -2 - player.fatigue[front] * .075 - (rotating ? 5 : 0) : 2) * dt, 0, 100);
  enemy.cohesion = clamp(enemy.cohesion + (contact ? -2 - enemy.fatigue * .075 : 2) * dt, 0, 100);

  if (rotating) {
    battle.rotationLeft = Math.max(0, battle.rotationLeft - dt - 1e-9);
    if (!battle.rotationLeft) {
      player.front = rear;
      battle.order = 'hold';
    }
  }
  if (player.cohesion === 0 || enemy.cohesion === 0) {
    battle.result = player.cohesion === enemy.cohesion ? '무승부' : player.cohesion > enemy.cohesion ? '승리' : '패배';
    battle.active = false;
  }
}

const byId = id => document.getElementById(id);
const commands = Array.from(document.querySelectorAll('[data-order]'));
const field = byId('field');
const ctx = field.getContext('2d');
const portrait = matchMedia('(orientation: portrait)');
let battle = freshBattle();
let lastTime;
let viewWidth = 0;
let viewHeight = 0;
let pixelRatio = 1;

function resize() {
  viewWidth = field.clientWidth;
  viewHeight = field.clientHeight;
  pixelRatio = Math.min(devicePixelRatio || 1, 2);
  field.width = Math.round(viewWidth * pixelRatio);
  field.height = Math.round(viewHeight * pixelRatio);
  draw();
}
function line(points, color, width) {
  ctx.beginPath();
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.stroke();
}
function ellipse(x, y, w, h, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}
function ridge(base, offset, color, height, scale) {
  ctx.beginPath();
  ctx.moveTo(-16, viewHeight);
  for (let x = -16; x < viewWidth + 24; x += 12) {
    const sample = x + offset;
    ctx.lineTo(x, base + (Math.sin(sample / scale) + .46 * Math.sin(sample / (scale * .49) + 2)) * height);
  }
  ctx.lineTo(viewWidth + 24, viewHeight);
  ctx.fillStyle = color;
  ctx.closePath();
  ctx.fill();
}

function drawLandscape(camera, zoom, ground) {
  const sky = ctx.createLinearGradient(0, 0, 0, ground);
  sky.addColorStop(0, '#2c1b41');
  sky.addColorStop(.52, '#9e4657');
  sky.addColorStop(.86, '#e48262');
  sky.addColorStop(1, '#ffbb82');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, viewWidth, viewHeight);
  const sunX = viewWidth * .61 - camera * zoom * .055;
  const sunY = ground - viewHeight * .24;
  const radius = viewHeight * .083;
  const glow = ctx.createRadialGradient(sunX, sunY, radius * .6, sunX, sunY, radius * 3.4);
  glow.addColorStop(0, '#ffd39e8c');
  glow.addColorStop(1, '#ffd39e00');
  ellipse(sunX, sunY, radius * 3.4, radius * 3.4, glow);
  ellipse(sunX, sunY, radius, radius, '#ffedbd');
  ridge(ground - viewHeight * .19, camera * zoom * .12, '#633342', viewHeight * .035, 114);
  ridge(ground - viewHeight * .10, camera * zoom * .34 + 180, '#462738', viewHeight * .036, 83);
  const earth = ctx.createLinearGradient(0, ground - 50, 0, viewHeight);
  earth.addColorStop(0, '#39242a');
  earth.addColorStop(1, '#160f17');
  ridge(ground - 29 * zoom, camera * zoom + 80, earth, 7 * zoom, 100);
  ctx.fillStyle = '#df9a683d';
  const start = Math.floor(camera / 31) * 31;
  for (let x = start; x < camera + viewWidth / zoom; x += 31) {
    const sx = (x - camera) * zoom;
    const y = ground + Math.sin(x * .137) * 17 * zoom;
    ctx.fillRect(sx, y, (3 + Math.abs(Math.sin(x)) * 8) * zoom, 1);
    ctx.fillRect(sx + 12 * zoom, y + 23 * zoom, 2 * zoom, 1);
  }
}

function soldiers(side, friendly, time) {
  const sprites = [];
  const direction = friendly ? 1 : -1;
  const rotating = friendly && battle.rotationLeft > 0;
  const progress = 1 - battle.rotationLeft / ROTATION_TIME;
  for (let rank = 0; rank < 2; rank++) {
    const front = rank === (friendly ? side.front : 0);
    for (let i = 0; i < 5; i++) {
      const swap = rotating ? smooth(clamp((progress - i * .038) / .848, 0, 1)) : 0;
      const slot = front ? 1 - swap : swap;
      const stride = (rotating || Math.abs(side.velocity) > 1) && battle.active;
      const depth = i * 10 + (front ? -1 : 1) * Math.sin(Math.PI * swap) * 15;
      sprites.push({
        x: side.x + direction * (-67 + 86 * slot + i * 11),
        depth,
        direction,
        friendly,
        tier:rank,
        phase:time * (stride ? 13 : 3) + i * 1.65 + rank * 1.2,
        stride,
        engaged:battle.active && enemyGap() <= CONTACT_GAP && front
      });
    }
  }
  return sprites;
}

function drawSoldier(soldier, screenX, ground, zoom) {
  const {depth, direction, friendly, tier, phase, stride, engaged} = soldier;
  const armor = friendly ? (tier ? '#50646b' : '#3a575e') : '#704047';
  const shield = friendly ? (tier ? '#6395a0' : '#427984') : '#a45951';
  const trim = friendly ? '#b3d1c6' : '#e2a584';
  const swing = stride ? Math.sin(phase) * 9 : 0;
  const bob = stride ? Math.abs(Math.sin(phase)) * 2.6 : Math.sin(phase) * (engaged ? 2.3 : .65);
  ctx.save();
  ctx.translate(screenX, ground + depth * zoom * .61);
  ellipse(0, 1, 16 * zoom, 3 * zoom, '#0c090c70');
  ctx.scale(direction * zoom, zoom);
  line([[-3,-29],[-7 - swing * .42,-16],[-6 - swing,0]], '#22191d', 6);
  line([[4,-29],[7 + swing * .4,-16],[5 + swing,0]], '#332629', 6);
  ctx.translate(0, -bob);
  line([[-3,-31],[-5,-54]], '#22191e', 22);
  line([[-3,-33],[-5,-54]], armor, 16);
  line([[-10,-39],[2,-39]], '#a17d62', 1.6);
  ellipse(-4,-65,7.5,9,'#b18a72');
  ellipse(-5,-69,9.4,7.6,'#262733');
  line([[-13,-67],[3,-67]], '#9d8977', 1.8);
  line([[-5,-76],[-10,-80],[-15,-78]], friendly ? '#79a3a8' : '#be6e5d', 3.8);
  const ready = engaged ? 1 : 0;
  const tipX = 30 + ready * (19 + Math.sin(phase) * 3);
  const tipY = -91 + ready * 48 + (stride ? Math.sin(phase) * 3 : 0);
  line([[-12,-32 + 14 * ready],[tipX,tipY]], '#b78a65', 2);
  line([[tipX - 3,tipY + (ready ? 0 : 4)],[tipX + 3,tipY - (ready ? 0 : 4)]], '#e7c8a7', 2.2);
  ellipse(10,-42,12,17,'#24181c');
  ellipse(10,-42,10.5,15.5,trim);
  ellipse(10,-42,9,14,shield);
  ellipse(10,-42,3.3,3.3,trim);
  ctx.restore();
}

function enemyGap() {
  return Math.max(0, battle.enemy.x - battle.player.x - CONTACT_DISTANCE);
}

function draw() {
  if (!viewWidth || !viewHeight) return;
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  const zoom = Math.min(viewHeight / 340, viewWidth / 880);
  const camera = battle.player.x - clamp(battle.player.x * .36, -100, 100) - viewWidth * .29 / zoom;
  const ground = viewHeight * .66;
  drawLandscape(camera, zoom, ground);
  const sprites = [...soldiers(battle.player, true, battle.elapsed), ...soldiers(battle.enemy, false, battle.elapsed)];
  sprites.sort((a,b) => a.depth - b.depth);
  sprites.forEach(sprite => drawSoldier(sprite, (sprite.x - camera) * zoom, ground, zoom));
}

function updateText(id, text) {
  const element = byId(id);
  if (element.textContent !== text) element.textContent = text;
}
function render() {
  const {player, enemy} = battle;
  const gap = enemyGap();
  const contact = gap <= CONTACT_GAP;
  updateText('clock', '경과 ' + battle.elapsed.toFixed(1) + '초');
  updateText('gap', contact ? '전열 접촉' : '간격 ' + Math.ceil(gap / 10));
  updateText('playerCohesion', '응집도 ' + Math.ceil(player.cohesion));
  updateText('enemyCohesion', '응집도 ' + Math.ceil(enemy.cohesion));
  byId('playerMeter').value = player.cohesion;
  byId('enemyMeter').value = enemy.cohesion;
  updateText('frontLabel', '전방 ' + 'AB'[player.front] + ' 피로 ' + Math.round(player.fatigue[player.front]));
  updateText('rearLabel', '후방 ' + 'AB'[1 - player.front] + ' 피로 ' + Math.round(player.fatigue[1 - player.front]));
  updateText('enemyStatus', battle.result ? '전투 종료' : contact ? '접촉 중' : '접근 중');
  updateText('status', battle.result ? '전투 종료 · ' + battle.result : ORDERS[battle.order]);
  byId('rotation').hidden = !battle.active || battle.rotationLeft === 0;
  byId('rotation').value = ROTATION_TIME - battle.rotationLeft;
  commands.forEach(button => {
    button.disabled = !battle.active || battle.rotationLeft > 0;
    button.setAttribute('aria-pressed', String(battle.active && button.dataset.order === battle.order));
  });
  draw();
}

function start() {
  battle = freshBattle();
  battle.active = true;
  lastTime = undefined;
  byId('cover').hidden = true;
  render();
}
commands.forEach(button => button.addEventListener('click', () => {
  issue(battle, button.dataset.order);
  render();
}));
byId('start').addEventListener('click', start);
byId('restart').addEventListener('click', start);

const fullscreen = byId('fullscreen');
fullscreen.hidden = !(byId('game').requestFullscreen && screen.orientation?.lock && document.fullscreenEnabled);
fullscreen.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await byId('game').requestFullscreen();
    await screen.orientation.lock('landscape');
  } catch {
    if (document.fullscreenElement === byId('game')) await document.exitFullscreen().catch(() => {});
    fullscreen.hidden = true;
  }
});

function frame(now) {
  if (battle.active && lastTime !== undefined && now > lastTime && !document.hidden && !portrait.matches) {
    step(battle, Math.min(.05, (now - lastTime) / 1000));
    render();
  }
  lastTime = now;
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
